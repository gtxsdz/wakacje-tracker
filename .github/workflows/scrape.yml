name: Deploy na GitHub Pages

# Uwaga: scrapowanie NIE działa z GitHub Actions — wakacje.pl zwraca HTTP 449
# dla adresów IP centrów danych (blokada anty-bot). Dane pobiera lokalny skrypt
# (npm run push) z domowego IP i wypycha je do repo. Ten workflow tylko publikuje
# witrynę na GitHub Pages po każdym pushu danych lub zmianie frontendu.

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "app.js"
      - "styles.css"
      - "data/**"
      - ".nojekyll"
      - ".github/workflows/scrape.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (cała witryna)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
